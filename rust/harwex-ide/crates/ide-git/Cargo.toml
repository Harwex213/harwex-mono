[package]
name = "ide-git"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Network goes through the git CLI, so libgit2 needs neither https nor ssh (no openssl to build).
git2 = { version = "0.20", default-features = false }
similar = "2"

[dev-dependencies]
tempfile = "3"
