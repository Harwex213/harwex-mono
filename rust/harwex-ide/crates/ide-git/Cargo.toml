[package]
name = "ide-git"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
# Network goes through the git CLI, so libgit2 needs neither https nor ssh (no openssl to build).
git2 = { version = "0.20", default-features = false }
similar = "2"
# Log text filter with the `.*` toggle. Already in the workspace lock through other crates.
regex = "1"

# kill(2) on a git process group (cancel and timeout). Already in the lock through git2.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"
