[alias]
# Build harwex-ide in release and install it for the current user (see docs/usage.md).
install-ide = "run -p xtask --release -- install"
uninstall-ide = "run -p xtask --release -- uninstall"
xtask = "run -p xtask --release --"
# The full test suite, one full run at a time (`cargo xtask test`, docs/testing.md). Not `t`:
# cargo's built-in `t` (= test) shadows a user alias of that name.
test-all = "run -p xtask --release -- test"
