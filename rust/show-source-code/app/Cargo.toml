[package]
name = "show-code-source"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "show_code_source"
path = "src/lib.rs"

[[bin]]
name = "show-code-source"
path = "src/main.rs"

[dependencies]
eframe.workspace = true
egui.workspace = true
scs-workspace = { path = "../crates/scs-workspace" }
scs-layout = { path = "../crates/scs-layout" }
scs-ts = { path = "../crates/scs-ts" }

[dev-dependencies]
egui_kittest = { version = "0.31", features = ["wgpu", "snapshot", "eframe"] }
image = { version = "0.25", default-features = false, features = ["png"] }
