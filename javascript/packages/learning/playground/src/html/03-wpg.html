<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hex Map – WPG</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #0f1115;
        color: #eaeef2;
        font-family: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto,
          Helvetica, Arial, Apple Color Emoji, Segoe UI Emoji;
        overflow: hidden;
      }

      #ui {
        position: fixed;
        inset: 12px auto auto 12px;
        z-index: 2;
        background: rgba(20, 22, 28, 0.8);
        backdrop-filter: blur(6px);
        border: 1px solid #2a2f3a;
        border-radius: 10px;
        padding: 10px 12px;
        line-height: 1.4;
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      }

      #ui h3 {
        margin: 0 0 8px 0;
        font-size: 14px;
        font-weight: 600;
        color: #c8d2e0;
      }

      #legend {
        display: flex;
        gap: 10px;
        align-items: center;
        flex-wrap: wrap;
        font-size: 12px;
      }

      .chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid #2a2f3a;
        border-radius: 999px;
        padding: 2px 8px;
        background: #151821;
      }

      .swatch {
        width: 14px;
        height: 14px;
        border-radius: 4px;
        border: 1px solid rgba(0, 0, 0, 0.25);
        box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.06);
      }

      #help {
        margin-top: 8px;
        font-size: 12px;
        color: #9fb0c3;
      }

      #app {
        position: fixed;
        inset: 0;
      }

      svg#map {
        width: 100%;
        height: 100%;
        touch-action: none; /* enable custom pan/zoom */
        user-select: none;
        -webkit-user-drag: none;
        background: radial-gradient(1200px 800px at 60% -10%, #1b2030, #0f1115);
      }

      .tile {
        stroke: #11151d;
        stroke-opacity: 0.9;
        stroke-width: 1.25;
        /* Avoid hairline gaps between adjacent polygons when zoomed */
        vector-effect: non-scaling-stroke;
        paint-order: stroke fill;
        shape-rendering: geometricPrecision;
        stroke-linejoin: round;
        transition: fill 120ms ease, stroke 120ms ease, opacity 120ms ease;
        pointer-events: all;
      }

      .tile:hover {
        filter: brightness(1.06);
        stroke-width: 1.4;
      }

      .tile.selected {
        stroke: #f7f7f7;
        stroke-width: 2.2;
      }

      /* Terrain fills */
      .desert {
        fill: #e4c580;
      }
      .grass {
        fill: #7ec850;
      }
      .snow {
        fill: #e9f4ff;
      }

      .city {
        fill: #ff3b3b;
        stroke: #0e0e12;
        stroke-width: 1.2;
        filter: drop-shadow(0 0 2px rgba(255, 59, 59, 0.5));
        pointer-events: none; /* clicks go to underlying hex */
      }

      .coords-label {
        font-size: 9px;
        fill: #314257;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div id="ui">
      <h3>Hex Map</h3>
      <div id="legend">
        <span class="chip"><span class="swatch" style="background:#e4c580"></span> Desert</span>
        <span class="chip"><span class="swatch" style="background:#7ec850"></span> Grass</span>
        <span class="chip"><span class="swatch" style="background:#e9f4ff"></span> Snow</span>
        <span class="chip">City: <span style="display:inline-block;width:10px;height:10px;background:#ff3b3b;border-radius:50%;margin-left:6px;border:1px solid #0e0e12"></span></span>
      </div>
      <div id="help">Wheel to zoom. Drag to pan. Click hex to select.</div>
    </div>
    <div id="app">
      <svg id="map" xmlns="http://www.w3.org/2000/svg">
        <g id="map-layer"></g>
      </svg>
    </div>

    <script>
      (function () {
        const svg = document.getElementById('map');
        const layer = document.getElementById('map-layer');

        const HEX_SIZE = 24; // radius of hex in px
        const MAP_RADIUS = 14; // hex radius (controls total map size)

        // Camera transform state
        const camera = {
          x: window.innerWidth * 0.5,
          y: window.innerHeight * 0.5,
          scale: 1,
        };

        // Utility: convert client screen point to SVG space (which in our case is CSS pixels)
        function clientPointInSvg(evt) {
          const rect = svg.getBoundingClientRect();
          return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
        }

        function applyTransform() {
          layer.setAttribute(
            'transform',
            `translate(${camera.x.toFixed(2)}, ${camera.y.toFixed(2)}) scale(${camera.scale.toFixed(4)})`
          );
        }

        // Hex math (pointy-top axial)
        const SQRT3 = Math.sqrt(3);
        function axialToPixel(q, r, size) {
          // Standard pointy-top axial → pixel conversion
          // x = size * sqrt(3) * (q + r/2)
          // y = size * 3/2 * r
          const x = size * SQRT3 * (q + r / 2);
          const y = size * 1.5 * r;
          return { x, y };
        }

        function hexPolygonPoints(cx, cy, size) {
          const pts = [];
          for (let i = 0; i < 6; i++) {
            const angle = ((60 * i - 30) * Math.PI) / 180; // pointy-top
            const px = cx + size * Math.cos(angle);
            const py = cy + size * Math.sin(angle);
            // Keep full precision to prevent tiny gaps due to rounding
            pts.push(`${px},${py}`);
          }
          return pts.join(' ');
        }

        // Deterministic pseudo-random based on coordinates
        function prng2(q, r, salt = 1337.123) {
          const s = Math.sin(q * 12.9898 + r * 78.233 + salt) * 43758.5453;
          return s - Math.floor(s);
        }

        function pickTerrain(q, r) {
          const n = prng2(q, r);
          if (n < 0.33) return 'desert';
          if (n < 0.66) return 'grass';
          return 'snow';
        }

        function hasCity(q, r) {
          // Sparse cities
          return prng2(q, r, 9876.5) > 0.95;
        }

        function createHexTile(q, r, cx, cy) {
          const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
          g.classList.add('hex');
          g.dataset.q = String(q);
          g.dataset.r = String(r);

          const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
          poly.setAttribute('points', hexPolygonPoints(cx, cy, HEX_SIZE));
          const terrain = pickTerrain(q, r);
          poly.classList.add('tile', terrain);
          g.appendChild(poly);

          // Optional city
          if (hasCity(q, r)) {
            const city = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            city.setAttribute('cx', cx);
            city.setAttribute('cy', cy);
            city.setAttribute('r', String(Math.max(2.5, HEX_SIZE * 0.18)));
            city.setAttribute('class', 'city');
            g.appendChild(city);
          }

          return g;
        }

        function buildHexMap(radius) {
          const frag = document.createDocumentFragment();
          for (let q = -radius; q <= radius; q++) {
            const rMin = Math.max(-radius, -q - radius);
            const rMax = Math.min(radius, -q + radius);
            for (let r = rMin; r <= rMax; r++) {
              const { x, y } = axialToPixel(q, r, HEX_SIZE);
              const tile = createHexTile(q, r, x, y);
              frag.appendChild(tile);
            }
          }
          layer.appendChild(frag);
        }

        // Interaction: selection via event delegation
        layer.addEventListener('click', (evt) => {
          const poly = evt.target.closest('polygon.tile');
          if (!poly) return;
          poly.classList.toggle('selected');
        });

        // Interaction: pan
        let isPanning = false;
        let panStart = { x: 0, y: 0 };
        let camStart = { x: camera.x, y: camera.y };

        svg.addEventListener('pointerdown', (evt) => {
          // Only start panning if background or layer is dragged, not when clicking on UI
          if (evt.button !== 0) return;
          isPanning = true;
          svg.setPointerCapture(evt.pointerId);
          panStart = clientPointInSvg(evt);
          camStart = { x: camera.x, y: camera.y };
        });

        svg.addEventListener('pointermove', (evt) => {
          if (!isPanning) return;
          const p = clientPointInSvg(evt);
          camera.x = camStart.x + (p.x - panStart.x);
          camera.y = camStart.y + (p.y - panStart.y);
          applyTransform();
        });

        svg.addEventListener('pointerup', (evt) => {
          if (!isPanning) return;
          isPanning = false;
          try { svg.releasePointerCapture(evt.pointerId); } catch (_) {}
        });

        svg.addEventListener('pointerleave', () => {
          isPanning = false;
        });

        // Interaction: zoom (keep cursor position stable in world space)
        svg.addEventListener('wheel', (evt) => {
          evt.preventDefault();
          const { x: mx, y: my } = clientPointInSvg(evt);

          const scaleBefore = camera.scale;
          const zoomIntensity = 1.0018; // smooth zoom
          const wheel = -evt.deltaY; // up -> zoom in
          const scaleFactor = Math.pow(zoomIntensity, wheel);
          const scaleAfter = clamp(scaleBefore * scaleFactor, 0.35, 6);

          // World point under mouse before zoom
          const wx = (mx - camera.x) / scaleBefore;
          const wy = (my - camera.y) / scaleBefore;

          camera.scale = scaleAfter;
          // Recompute camera so that world point under cursor stays fixed
          camera.x = mx - wx * scaleAfter;
          camera.y = my - wy * scaleAfter;
          applyTransform();
        }, { passive: false });

        function clamp(v, min, max) {
          return Math.max(min, Math.min(max, v));
        }

        // Resize: keep camera offset reasonable
        window.addEventListener('resize', () => {
          // no-op; keep current camera to avoid jump
          applyTransform();
        });

        // Init
        buildHexMap(MAP_RADIUS);
        applyTransform();

        // Keep map centered at the origin. No heuristic nudge is necessary
        // because our axial-to-pixel conversion is symmetric around (0,0).

        // Double click to reset camera
        svg.addEventListener('dblclick', () => {
          camera.scale = 1;
          camera.x = window.innerWidth * 0.5;
          camera.y = window.innerHeight * 0.5;
          applyTransform();
        });
      })();
    </script>
  </body>
  </html>
