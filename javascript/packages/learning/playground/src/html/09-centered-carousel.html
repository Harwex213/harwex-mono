<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta content="ie=edge" http-equiv="X-UA-Compatible">
    <title>Layered Centered Carousel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --slide-width: 500px;
            --offset-1: 350px;
            --offset-2: 450px;
            --offset-hidden: 650px;
            --nav-inset: 40px;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: #0e0e10;
            color: white;
            padding: 50px 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-container {
            position: relative;
            width: 100%;
            max-width: 1400px;
            height: 500px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .carousel-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .carousel-slide {
            position: absolute;
            width: var(--slide-width);
            cursor: pointer;
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), filter 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            transform-origin: center center;
        }

        .carousel-slide img {
            width: 100%;
            height: 280px;
            object-fit: cover;
            border-radius: 12px;
            display: block;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .slide-content {
            background: #18181b;
            padding: 20px;
            border-radius: 0 0 12px 12px;
            margin-top: -4px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
        }

        .slide-title {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        .slide-description {
            font-size: 14px;
            color: #adadb8;
        }

        /* Center slide - highest z-index, full size */
        .carousel-slide.center {
            z-index: 100;
            transform: translateX(0) scale(1);
            filter: brightness(1);
        }

        /* Right slides (next) - positioned to the right, stacked */
        .carousel-slide.next-1 {
            z-index: 90;
            transform: translateX(var(--offset-1)) scale(0.85);
            filter: brightness(0.55);
        }

        .carousel-slide.next-2 {
            z-index: 80;
            transform: translateX(var(--offset-2)) scale(0.7);
            filter: brightness(0.35);
        }

        /* Left slides (previous) - positioned to the left, stacked */
        .carousel-slide.prev-1 {
            z-index: 90;
            transform: translateX(calc(-1 * var(--offset-1))) scale(0.85);
            filter: brightness(0.55);
        }

        .carousel-slide.prev-2 {
            z-index: 80;
            transform: translateX(calc(-1 * var(--offset-2))) scale(0.7);
            opacity: 0.5;
        }

        /* Hidden slides - parked beyond the visible stack on each side */
        .carousel-slide.hidden-left {
            z-index: 0;
            transform: translateX(calc(-1 * var(--offset-hidden))) scale(0.5);
            opacity: 0;
            filter: brightness(0.35);
            pointer-events: none;
        }

        .carousel-slide.hidden-right {
            z-index: 0;
            transform: translateX(var(--offset-hidden)) scale(0.5);
            opacity: 0;
            filter: brightness(0.35);
            pointer-events: none;
        }

        /* Navigation buttons */
        .carousel-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(0, 0, 0, 0.7);
            border: none;
            color: white;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            z-index: 200;
            backdrop-filter: blur(10px);
        }

        .carousel-nav:hover {
            background: rgba(0, 0, 0, 0.9);
            transform: translateY(-50%) scale(1.1);
        }

        .carousel-nav.prev {
            left: var(--nav-inset);
        }

        .carousel-nav.next {
            right: var(--nav-inset);
        }

        .carousel-nav:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .carousel-nav:disabled:hover {
            transform: translateY(-50%) scale(1);
        }

        /* Indicators */
        .carousel-indicators {
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            gap: 12px;
            z-index: 200;
        }

        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #3a3a3d;
            cursor: pointer;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }

        .indicator:hover {
            background: #5a5a5d;
        }

        .indicator.active {
            background: #9147ff;
            width: 35px;
            border-radius: 6px;
        }

        /* Responsive tiers */
        @media (max-width: 1300px) {
            :root {
                --slide-width: min(500px, 90vw);
                --offset-1: 26vw;
                --offset-2: 34vw;
                --offset-hidden: 48vw;
                --nav-inset: 16px;
            }
        }

        @media (max-width: 640px) {
            :root {
                --offset-1: 18vw;
                --offset-2: 26vw;
                --offset-hidden: 60vw;
                --nav-inset: 8px;
            }

            .carousel-nav {
                width: 44px;
                height: 44px;
                font-size: 22px;
            }
        }
    </style>
</head>
<body>

<div class="carousel-container">
    <button type="button" class="carousel-nav prev" id="prevBtn" aria-label="Previous slide">‹</button>
    <button type="button" class="carousel-nav next" id="nextBtn" aria-label="Next slide">›</button>

    <div class="carousel-wrapper" id="carouselWrapper">
        <!-- Slides will be generated by JavaScript -->
    </div>

    <div class="carousel-indicators" id="indicators"></div>
</div>

<script>
  // Sample data for carousel slides
  const slides = [
    {
      image: 'https://picsum.photos/500/280?random=1',
      title: 'Slide 1',
      description: 'First amazing content'
    },
    {
      image: 'https://picsum.photos/500/280?random=2',
      title: 'Slide 2',
      description: 'Second amazing content'
    },
    {
      image: 'https://picsum.photos/500/280?random=3',
      title: 'Slide 3',
      description: 'Third amazing content'
    },
    {
      image: 'https://picsum.photos/500/280?random=4',
      title: 'Slide 4',
      description: 'Fourth amazing content'
    },
    {
      image: 'https://picsum.photos/500/280?random=5',
      title: 'Slide 5',
      description: 'Fifth amazing content'
    },
    {
      image: 'https://picsum.photos/500/280?random=6',
      title: 'Slide 6',
      description: 'Sixth amazing content'
    },
    {
      image: 'https://picsum.photos/500/280?random=7',
      title: 'Slide 7',
      description: 'Seventh amazing content'
    }
  ];

  class CenteredCarousel {
    constructor(slides, containerId) {
      this.slides = slides;
      this.currentIndex = 0;
      this.wrapper = document.getElementById(containerId);
      this.prevBtn = document.getElementById('prevBtn');
      this.nextBtn = document.getElementById('nextBtn');
      this.indicatorsContainer = document.getElementById('indicators');

      this.init();
    }

    init() {
      this.renderSlides();
      this.renderIndicators();
      this.attachEventListeners();
      this.updateCarousel();
    }

    renderSlides() {
      this.wrapper.innerHTML = '';
      this.slides.forEach((slide, index) => {
        const slideEl = document.createElement('div');
        slideEl.className = 'carousel-slide';
        slideEl.dataset.index = index;

        const img = document.createElement('img');
        img.src = slide.image;
        img.alt = slide.title;

        const content = document.createElement('div');
        content.className = 'slide-content';

        const title = document.createElement('div');
        title.className = 'slide-title';
        title.textContent = slide.title;

        const description = document.createElement('div');
        description.className = 'slide-description';
        description.textContent = slide.description;

        content.append(title, description);
        slideEl.append(img, content);
        this.wrapper.appendChild(slideEl);
      });
    }

    renderIndicators() {
      this.indicatorsContainer.innerHTML = '';
      this.slides.forEach((_, index) => {
        const indicator = document.createElement('button');
        indicator.type = 'button';
        indicator.className = 'indicator';
        indicator.dataset.index = index;
        indicator.setAttribute('aria-label', `Go to slide ${index + 1}`);
        this.indicatorsContainer.appendChild(indicator);
      });
    }

    attachEventListeners() {
      this.prevBtn.addEventListener('click', () => this.goToPrev());
      this.nextBtn.addEventListener('click', () => this.goToNext());

      // Click on slide to navigate
      const slideElements = this.wrapper.querySelectorAll('.carousel-slide');
      slideElements.forEach((slide, index) => {
        slide.addEventListener('click', () => {
          const slideIndex = parseInt(slide.dataset.index);
          if (slideIndex !== this.currentIndex) {
            this.goToSlide(slideIndex);
          }
        });
      });

      // Click on indicators
      const indicators = this.indicatorsContainer.querySelectorAll('.indicator');
      indicators.forEach((indicator, index) => {
        indicator.addEventListener('click', () => this.goToSlide(index));
      });

      // Keyboard navigation
      document.addEventListener('keydown', (e) => {
        if (e.key === 'ArrowLeft') {
          this.goToPrev();
        } else if (e.key === 'ArrowRight') {
          this.goToNext();
        }
      });
    }

    goToPrev() {
      if (this.currentIndex > 0) {
        this.currentIndex--;
        this.updateCarousel();
      }
    }

    goToNext() {
      if (this.currentIndex < this.slides.length - 1) {
        this.currentIndex++;
        this.updateCarousel();
      }
    }

    goToSlide(index) {
      this.currentIndex = index;
      this.updateCarousel();
    }

    updateCarousel() {
      const slideElements = this.wrapper.querySelectorAll('.carousel-slide');

      slideElements.forEach((slide, index) => {
        // Remove all position classes
        slide.classList.remove('center', 'next-1', 'next-2', 'prev-1', 'prev-2', 'hidden-left', 'hidden-right');

        const relativePosition = index - this.currentIndex;

        // Apply appropriate class based on position relative to current
        if (relativePosition === 0) {
          slide.classList.add('center');
        } else if (relativePosition === 1) {
          slide.classList.add('next-1');
        } else if (relativePosition === 2) {
          slide.classList.add('next-2');
        } else if (relativePosition === -1) {
          slide.classList.add('prev-1');
        } else if (relativePosition === -2) {
          slide.classList.add('prev-2');
        } else if (relativePosition < -2) {
          slide.classList.add('hidden-left');
        } else {
          slide.classList.add('hidden-right');
        }
      });

      // Update indicators
      const indicators = this.indicatorsContainer.querySelectorAll('.indicator');
      indicators.forEach((indicator, index) => {
        indicator.classList.toggle('active', index === this.currentIndex);
      });

      // Update navigation buttons state
      this.prevBtn.disabled = this.currentIndex === 0;
      this.nextBtn.disabled = this.currentIndex === this.slides.length - 1;
    }
  }

  // Initialize carousel
  const carousel = new CenteredCarousel(slides, 'carouselWrapper');
</script>

</body>
</html>
