<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <title>3. Manipulating Buffers</title>
    <script src="3-buffers.js" type="module"></script>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
        }

        #container {
            height: 100dvh;
            width: 100dvw;
            display: grid;
            grid-template-columns: 100%;
            grid-template-rows: 100%;
            overflow: hidden;
        }
    </style>
</head>
<body>
<div id="container"></div>
</body>
</html>
