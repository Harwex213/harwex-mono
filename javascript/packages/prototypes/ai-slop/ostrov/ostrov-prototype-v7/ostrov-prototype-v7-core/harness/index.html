<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ostrov v7 · ядро</title>
    <style>
      :root {
        --bg: #07111a;
        --surface: #12202e;
        --line: #26425c;
        --text: #f2f6fa;
        --muted: #8aa2b8;
        --accent: #7fc2ff;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.5 system-ui, -apple-system, Segoe UI, sans-serif;
      }

      #stage {
        position: fixed;
        inset: 0;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
        cursor: grab;
      }

      canvas.dragging {
        cursor: grabbing;
      }

      .panel {
        position: fixed;
        left: 16px;
        bottom: 16px;
        display: grid;
        gap: 14px;
        padding: 14px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(18, 32, 46, 0.86);
        backdrop-filter: blur(8px);
      }

      .controls {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .keys {
        display: flex;
        gap: 28px;
      }

      .keys h4 {
        margin: 0 0 6px;
        font-size: 10px;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #5b7288;
      }

      .keys .row {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--muted);
        font-size: 11px;
        line-height: 1.9;
      }

      .keys .dash {
        width: 26px;
        height: 0;
        border-top: 2px solid currentColor;
      }

      .keys .chip {
        width: 22px;
        height: 12px;
        border: 1px solid currentColor;
        border-radius: 4px;
      }

      input[type="search"] {
        width: 170px;
        padding: 6px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #0c1824;
        color: var(--text);
        font: inherit;
      }

      input[type="search"]:focus {
        outline: 1px solid var(--accent);
      }

      button {
        padding: 6px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: #0c1824;
        color: var(--text);
        font: inherit;
        cursor: pointer;
      }

      button:hover {
        border-color: var(--accent);
      }

      .zoom {
        min-width: 46px;
        text-align: center;
        color: var(--muted);
        font-variant-numeric: tabular-nums;
      }

      aside {
        position: fixed;
        top: 16px;
        right: 16px;
        bottom: 16px;
        width: 320px;
        display: none;
        overflow-y: auto;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: rgba(18, 32, 46, 0.92);
        backdrop-filter: blur(8px);
      }

      aside.open {
        display: block;
      }

      aside h2 {
        margin: 0 0 2px;
        font-size: 16px;
      }

      aside .path {
        margin: 0 0 12px;
        color: var(--muted);
        font-size: 11px;
      }

      aside .doc {
        margin: 0 0 14px;
        color: var(--muted);
      }

      aside h3 {
        margin: 14px 0 6px;
        font-size: 10px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #5b7288;
      }

      aside ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      aside li {
        padding: 3px 0;
        font: 12px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
        overflow-wrap: anywhere;
      }

      aside li .type {
        color: var(--accent);
      }

      aside .tok-name {
        color: #ffd79a;
      }

      aside .tok-param {
        color: #dbe6f1;
      }

      aside .tok-type {
        color: var(--accent);
      }

      aside .tok-keyword {
        color: #c792ea;
      }

      aside .tok-punct {
        color: #5f7488;
      }

      aside .close {
        float: right;
        padding: 2px 8px;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>

    <div class="panel" id="panel">
      <div class="controls">
        <input type="search" id="search" placeholder="поиск" />
        <button id="format">format</button>
        <button id="fit">по размеру</button>
        <button id="out">−</button>
        <span class="zoom" id="zoom">100%</span>
        <button id="in">+</button>
      </div>

      <div class="keys">
        <div>
          <h4>узлы</h4>
          <div id="node-keys"></div>
        </div>
        <div>
          <h4>связи</h4>
          <div id="edge-keys"></div>
        </div>
      </div>
    </div>

    <aside id="inspector"></aside>
  </body>
</html>
