# `server_name _` on purpose: the domain lives in DNS and in deploy.sh, so this
# file needs no edit when the domain changes.
server {
    listen 80;
    listen [::]:80;

    server_name _;

    return 301 https://$host$request_uri;
}

# The sites server is the default for every host that no other block names.
# Without default_server, nginx would pick whichever 443 block comes first, and
# a reordering could hand unknown hosts to imagegen.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    http2 on;

    server_name _;

    # Cloudflare Origin CA certificate
    ssl_certificate /etc/ssl/origin/cert.pem;
    ssl_certificate_key /etc/ssl/origin/key.pem;

    # Every site sits in its own directory under the root, named after its
    # route: /faenwald-battle/ serves faenwald-battle/index.html. A request
    # without the trailing slash is redirected to it by nginx, because the
    # directory exists. The redirect is relative: behind Cloudflare an absolute
    # one would carry the container's own scheme and port.
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;

    # index.html carries no hash and must not be cached, or the browser keeps
    # loading the previous bundle after a deploy.
    #
    # The header sits here rather than in a `location = /index.html`: the browser
    # asks for `/`, and try_files resolves that to index.html internally without
    # matching locations a second time. The hashed assets below are unaffected,
    # because a regex location wins over this prefix one.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }

    # rspack emits content-hashed filenames for these, so a stale cache entry is
    # never served: a changed file arrives under a new name.
    # One add_header rather than `expires 1y` plus a second add_header: both set
    # Cache-Control, and the response then carries the header twice.
    location ~* \.(js|css|png|mp3|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}

# imagegen.<domain>: a remote MCP server in its own compose project. Its
# container joins the external `hw` network under the name hw-imagegen.
# `imagegen.*` keeps the domain out of this file, like `_` above.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name imagegen.*;

    ssl_certificate /etc/ssl/origin/cert.pem;
    ssl_certificate_key /etc/ssl/origin/key.pem;

    # Docker's embedded DNS. A variable in proxy_pass makes nginx resolve the
    # name per request instead of once at startup. nginx then starts even when
    # hw-imagegen is down. Requests get a 502 and the sites keep working.
    resolver 127.0.0.11 valid=10s;
    set $imagegen http://hw-imagegen:3000;

    # Requests carry base64 images up to about 50 MB. The body streams to the
    # upstream as it arrives, so nginx does not spool it to a temp file first.
    client_max_body_size 50m;
    proxy_request_buffering off;

    # Responses are SSE streams. Buffering would hold events back until the
    # buffer fills, so it is off. gzip is off for the same reason.
    proxy_buffering off;
    proxy_cache off;
    gzip off;

    # A tool call can run 5-6 minutes. The default 60 s would cut it off.
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;

    location / {
        # HTTP/1.1 with an empty Connection header keeps the upstream
        # connection open for the whole stream.
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_pass $imagegen;
    }
}
