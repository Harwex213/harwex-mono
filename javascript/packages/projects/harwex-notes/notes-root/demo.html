<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Sandboxed demo</title>
  <style>
    body {
      margin: 0;
      padding: 2.5rem;
      background: #101418;
      color: #e6edf3;
      font: 16px/1.6 system-ui, sans-serif;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: 1.6rem;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0 0 1rem;
      max-width: 46ch;
      color: #9aa7b4;
    }

    button {
      font: inherit;
      padding: 0.45rem 0.9rem;
      border-radius: 6px;
      border: 1px solid #3d444d;
      background: #1c2129;
      color: #e6edf3;
      cursor: pointer;
    }

    button:hover {
      border-color: #58a6ff;
    }

    output {
      display: block;
      margin-top: 1rem;
      font-family: ui-monospace, Menlo, monospace;
      color: #3fb950;
    }
  </style>
</head>

<body>
  <h1>This page is inside an iframe</h1>
  <p>
    Scripts run, because the frame is granted <code>allow-scripts</code>. It is
    not granted <code>allow-same-origin</code>, so the document sits on an
    opaque origin and cannot touch the app around it.
  </p>
  <button id="poke">Prove scripts run</button>
  <output id="out">waiting</output>
  <script>
    var count = 0;
    document.getElementById("poke").addEventListener("click", function () {
      count += 1;
      document.getElementById("out").textContent =
        "clicked " + count + " time(s); origin is " + (location.origin || "opaque");
    });
  </script>
</body>

</html>
